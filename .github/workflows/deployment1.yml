name: Deployment Exercise 1
on: push 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint     # 🌟 Fixed: Changed from 'npm run test' to 'npm run lint'

      - name: Test code
        run: npm run test     # 🌟 Fixed: Changed 'Test' to lowercase 'test'

      - name: Build code  
        run: npm run build

      - name: Deploy code
        run: echo "Deployment done....."